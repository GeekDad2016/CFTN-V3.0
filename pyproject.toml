[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cftn-v3"
version = "3.0.0"
description = "Twelve-tower selective continual learning for English and Romanian"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "transformers>=4.51,<5", "safetensors>=0.5", "huggingface-hub>=0.30", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
teacher = ["pyarrow>=18"]

[project.scripts]
cftn = "cftn_v3.cli:main"

[tool.setuptools.packages.find]
include = ["cftn_v3*"]

[tool.setuptools.package-data]
cftn_v3 = ["dashboard.html", "local_math_dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
